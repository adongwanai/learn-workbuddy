<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Inter, Noto Sans SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="recordGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="runtimeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="720" fill="#f8fafc"/>
  <circle cx="1015" cy="78" r="110" fill="#e0e7ff" opacity="0.45"/>
  <circle cx="90" cy="650" r="125" fill="#cffafe" opacity="0.38"/>

  <text x="550" y="48" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Session Lifecycle · Identity preservation, runtime reconstruction</text>
  <text x="550" y="74" text-anchor="middle" font-size="13" fill="#64748b">create / resume / close are three different boundaries; transcript is not equal to long-term memory</text>

  <!-- Create request enters the logical identity layer. -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="180" r="48" fill="#1d4ed8"/>
    <text x="100" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="white">CREATE</text>
    <text x="100" y="196" text-anchor="middle" font-size="11" fill="#dbeafe">new identity</text>
  </g>
  <polyline points="150,180 205,180" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Logical session record. -->
  <g filter="url(#shadow)">
    <rect x="215" y="104" width="435" height="152" rx="18" fill="url(#recordGradient)" stroke="#4f46e5" stroke-width="2"/>
    <rect x="215" y="104" width="14" height="152" rx="7" fill="#4f46e5"/>
    <text x="255" y="137" font-size="18" font-weight="700" fill="#312e81">Logical Session Record</text>
    <text x="255" y="160" font-size="12" fill="#6366f1">Can be retained across runtime generations</text>
    <rect x="255" y="180" width="104" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="307" y="200" text-anchor="middle" font-size="12" fill="#3730a3">session_id</text>
    <rect x="369" y="180" width="86" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="412" y="200" text-anchor="middle" font-size="12" fill="#3730a3">cwd</text>
    <rect x="465" y="180" width="118" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="524" y="200" text-anchor="middle" font-size="12" fill="#3730a3">mode / backend</text>
    <rect x="255" y="218" width="150" height="26" rx="13" fill="#e0e7ff"/>
    <text x="330" y="236" text-anchor="middle" font-size="11" fill="#4338ca">session transcript</text>
    <rect x="415" y="218" width="168" height="26" rx="13" fill="#e0e7ff"/>
    <text x="499" y="236" text-anchor="middle" font-size="11" fill="#4338ca">runtime generation</text>
  </g>

  <!-- Memory remains outside the session lifecycle. -->
  <g>
    <rect x="755" y="116" width="278" height="126" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="7,5"/>
    <text x="784" y="151" font-size="17" font-weight="700" fill="#9a3412">Long-term Memory</text>
    <text x="784" y="178" font-size="12" fill="#c2410c">Cross-session extraction, filtering, recall and forgetting</text>
    <text x="784" y="203" font-size="12" fill="#7c2d12">It is not deleted with close, nor is it a process snapshot of resume.</text>
    <rect x="784" y="216" width="126" height="20" rx="10" fill="#ffedd5"/>
    <text x="847" y="230" text-anchor="middle" font-size="10" fill="#9a3412">separate lifecycle</text>
  </g>
  <line x1="650" y1="180" x2="747" y2="180" stroke="#f97316" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="699" y="170" text-anchor="middle" font-size="10" fill="#c2410c">not equal</text>

  <!-- Fresh runtime generation. -->
  <polyline points="432,256 432,292 350,292 350,328" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="373" y="285" font-size="11" fill="#1d4ed8">spawn generation N</text>

  <g filter="url(#shadow)">
    <path d="M194,344 Q194,326 212,326 H621 Q639,326 639,344 V472 Q639,490 621,490 H212 Q194,490 194,472 Z" fill="url(#runtimeGradient)" stroke="#0891b2" stroke-width="2"/>
    <text x="228" y="362" font-size="18" font-weight="700" fill="#155e75">Session Runtime · Generation N</text>
    <text x="228" y="385" font-size="12" fill="#0e7490">Temporary execution resources; all must be released after close</text>

    <circle cx="250" cy="428" r="25" fill="#06b6d4"/>
    <text x="250" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="white">HTTP</text>
    <text x="250" y="468" text-anchor="middle" font-size="10" fill="#155e75">listener / port</text>

    <circle cx="365" cy="428" r="25" fill="#0ea5e9"/>
    <text x="365" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="white">TURN</text>
    <text x="365" y="468" text-anchor="middle" font-size="10" fill="#155e75">thread / lock</text>

    <circle cx="480" cy="428" r="25" fill="#3b82f6"/>
    <text x="480" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="white">SDK</text>
    <text x="480" y="468" text-anchor="middle" font-size="10" fill="#155e75">provider client</text>

    <circle cx="595" cy="428" r="25" fill="#6366f1"/>
    <text x="595" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="white">ABORT</text>
    <text x="595" y="468" text-anchor="middle" font-size="10" fill="#155e75">runtime signal</text>
  </g>

  <!-- Close and resume explicitly form a new generation. -->
  <polyline points="639,408 700,408" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <g filter="url(#shadow)">
    <circle cx="759" cy="408" r="48" fill="#d97706"/>
    <text x="759" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="white">CLOSE</text>
    <text x="759" y="424" text-anchor="middle" font-size="11" fill="#ffedd5">release runtime</text>
  </g>
  <polyline points="759,358 759,288 600,288 600,256" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowBlue)"/>
  <text x="682" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">RESUME → generation N+1</text>
  <text x="810" y="408" font-size="11" fill="#92400e">record retained</text>

  <!-- State machine strip. -->
  <text x="550" y="545" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Runtime State Machine</text>

  <g>
    <rect x="66" y="575" width="120" height="42" rx="21" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="126" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">creating</text>

    <line x1="186" y1="596" x2="234" y2="596" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="240" y="575" width="120" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/>
    <text x="300" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">idle</text>

    <line x1="360" y1="596" x2="408" y2="596" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="384" y="584" text-anchor="middle" font-size="10" fill="#475569">prompt</text>
    <rect x="414" y="575" width="120" height="42" rx="21" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="474" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">running</text>

    <path d="M474,617 C474,646 300,646 300,619" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="387" y="657" text-anchor="middle" font-size="10" fill="#166534">turn completed</text>

    <line x1="534" y1="596" x2="582" y2="596" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <text x="558" y="584" text-anchor="middle" font-size="10" fill="#92400e">close</text>
    <rect x="588" y="575" width="120" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="648" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">closing</text>

    <line x1="708" y1="596" x2="756" y2="596" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="762" y="575" width="120" height="42" rx="21" fill="#e2e8f0" stroke="#64748b"/>
    <text x="822" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">closed</text>

    <polyline points="474,575 474,555 930,555 930,575" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="914" y="575" width="120" height="42" rx="21" fill="#fee2e2" stroke="#ef4444"/>
    <text x="974" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">error</text>
  </g>

  <rect x="194" y="683" width="712" height="24" rx="12" fill="#e2e8f0"/>
  <text x="550" y="700" text-anchor="middle" font-size="11" fill="#475569">session_id continuity ≠ process continuity · transcript continuity ≠ long-term memory</text>
</svg>
