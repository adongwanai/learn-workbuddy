<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17325c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4d6b9a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16866f"/>
    </marker>
  </defs>

  <!-- Background and title -->
  <rect width="960" height="540" fill="url(#background)"/>
  <text x="48" y="52" font-size="26" font-weight="700" fill="#13233f">Deferred tools: discover first, then load, then execute</text>
  <text x="48" y="79" font-size="14" fill="#58708f">The same ToolEntry driver directory, schema and handler; the loading status only belongs to the current session</text>

  <!-- Startup context -->
  <rect x="48" y="112" width="248" height="162" rx="16" fill="#ffffff" stroke="#c8d6ea" filter="url(#shadow)"/>
  <rect x="48" y="112" width="248" height="42" rx="16" fill="#203d68"/>
  <path d="M48 138 H296 V154 H48 Z" fill="#203d68"/>
  <text x="70" y="139" font-size="15" font-weight="700" fill="#ffffff">Start context</text>
  <text x="70" y="181" font-size="13" font-weight="600" fill="#203d68">complete schema</text>
  <text x="181" y="181" font-size="12" fill="#58708f">Immediate tools</text>
  <text x="70" y="211" font-size="13" font-weight="600" fill="#203d68">compact directory</text>
  <text x="181" y="211" font-size="12" fill="#58708f">name + purpose</text>
  <text x="70" y="241" font-size="13" font-weight="600" fill="#203d68">bridging tools</text>
  <text x="181" y="241" font-size="12" fill="#58708f">Search + Execute</text>

  <!-- Discovery and stable result -->
  <rect x="356" y="112" width="248" height="162" rx="16" fill="#ffffff" stroke="#b9ccef" filter="url(#shadow)"/>
  <rect x="356" y="112" width="248" height="42" rx="16" fill="#3568b8"/>
  <path d="M356 138 H604 V154 H356 Z" fill="#3568b8"/>
  <text x="378" y="139" font-size="15" font-weight="700" fill="#ffffff">ToolSearch</text>
  <text x="378" y="181" font-size="13" fill="#203d68">① Exact name/keyword</text>
  <text x="378" y="211" font-size="13" fill="#203d68">② Search only deferred tools</text>
  <text x="378" y="241" font-size="13" fill="#203d68">③ (-score, name) stable sorting</text>

  <path d="M304 193 H344" fill="none" stroke="#4d6b9a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="324" y="181" text-anchor="middle" font-size="11" fill="#58708f">query</text>

  <!-- Loaded session state -->
  <rect x="664" y="112" width="248" height="162" rx="16" fill="#ffffff" stroke="#a9d8ce" filter="url(#shadow)"/>
  <rect x="664" y="112" width="248" height="42" rx="16" fill="#16866f"/>
  <path d="M664 138 H912 V154 H664 Z" fill="#16866f"/>
  <text x="686" y="139" font-size="15" font-weight="700" fill="#ffffff">ToolSearchResult</text>
  <text x="686" y="181" font-size="13" fill="#16483f">matches + full schema</text>
  <text x="686" y="211" font-size="13" fill="#16483f">missing + load state</text>
  <text x="686" y="241" font-size="13" fill="#16483f">session loaded cache</text>

  <path d="M612 193 H652" fill="none" stroke="#4d6b9a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="632" y="181" text-anchor="middle" font-size="11" fill="#58708f">top-k</text>

  <!-- Execution gate -->
  <rect x="194" y="340" width="572" height="126" rx="18" fill="#ffffff" stroke="#a9d8ce" filter="url(#shadow)"/>
  <text x="224" y="376" font-size="17" font-weight="700" fill="#16483f">DeferExecuteTool</text>

  <!-- Three execution checks -->
  <rect x="224" y="397" width="142" height="42" rx="10" fill="#eef6ff" stroke="#b9ccef"/>
  <text x="295" y="423" text-anchor="middle" font-size="13" fill="#203d68">Does the tool exist?</text>
  <path d="M373 418 H397" fill="none" stroke="#16866f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="404" y="397" width="152" height="42" rx="10" fill="#eefaf7" stroke="#a9d8ce"/>
  <text x="480" y="423" text-anchor="middle" font-size="13" fill="#16483f">Belongs to deferred?</text>
  <path d="M563 418 H587" fill="none" stroke="#16866f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="594" y="397" width="142" height="42" rx="10" fill="#eefaf7" stroke="#a9d8ce"/>
  <text x="665" y="423" text-anchor="middle" font-size="13" fill="#16483f">Schema loaded?</text>

  <path d="M788 282 C788 318 724 318 724 332" fill="none" stroke="#16866f" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="801" y="313" font-size="11" fill="#16866f">loaded schema</text>
  <path d="M480 466 V500" fill="none" stroke="#16866f" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="496" y="493" font-size="12" fill="#16483f">same ToolEntry.handler → tool result</text>

  <!-- Failure note -->
  <rect x="48" y="304" width="118" height="198" rx="14" fill="#fff7ed" stroke="#efc48f"/>
  <text x="68" y="338" font-size="14" font-weight="700" fill="#8a4d11">border failure</text>
  <text x="68" y="371" font-size="12" fill="#8a4d11">miss</text>
  <text x="68" y="396" font-size="12" fill="#8a4d11">Duplicate name</text>
  <text x="68" y="421" font-size="12" fill="#8a4d11">Not loaded for execution</text>
  <text x="68" y="446" font-size="12" fill="#8a4d11">Instant tool bypass</text>
  <text x="68" y="476" font-size="11" fill="#9d6a35">All converted into clear results</text>
</svg>
